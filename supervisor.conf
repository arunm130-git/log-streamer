[supervisord]
nodaemon=true

[program:symfony-server]
command=php -S 0.0.0.0:8000 -t public
autostart=true
autorestart=true
stderr_logfile=/var/log/symfony.err.log
stdout_logfile=/var/log/symfony.out.log

[program:logfileimporter]
command=php bin/console log:import logs/logs.log --env=prod --no-debug
autostart=true
autorestart=true
stderr_logfile=/var/log/logfileimporter.err.log
stdout_logfile=/var/log/logfileimporter.out.log
startsecs=0
restartsecs=10
